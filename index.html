<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo ODS</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <h1>Pegue a mudança</h1>
  <h3>Escolha uma ODS e pegue soluções para ela</h3>

  <!-- Start Screen -->
  <div id="start-screen" class="screen">
    <h1>🌍 Jogo dos ODS</h1>
    <p>Ajude a personagem a coletar soluções para um mundo melhor!</p>
    <button onclick="startGame()">Iniciar Jogo</button>
  </div>

  <!-- Canvas -->
  <canvas id="game-canvas" width="640" height="480" style="display:none;"></canvas>

  <!-- Message Box -->
  <div id="message-box"></div>

  <!-- End Screen -->
  <div id="end-screen" class="screen" style="display: none;">
    <h1>🎉 Parabéns!</h1>
    <p>Você concluiu todos os níveis do jogo!</p>
    <button onclick="restartGame()">Jogar Novamente</button>
  </div>

  
  <script src="script.js"></script>
</body>
</html>
